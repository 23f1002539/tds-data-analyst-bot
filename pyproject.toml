[project]
name = "tds-data-analyst-bot"
version = "0.1.0"
description = "TDS Project 1 — Data Analyst Telegram bot. An LLM agent that answers data-analysis questions and replies with a single JSON object."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "google-cloud-storage>=2.10",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.9",
    "tabulate>=0.9",
]

[tool.uv]
package = false